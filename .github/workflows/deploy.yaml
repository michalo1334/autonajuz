name: Deploy to DigitalOcean
on:
    push:
        branches:
        - '*'
    workflow_dispatch:
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repository
          uses: actions/checkout@v2
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v1
        - name: Login to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DIGITAL_OCEAN_USERNAME }}
            password: ${{ secrets.DIGITAL_OCEAN_DOCKER_TOKEN }}
        - name: Build and push Docker images
          run: |
            docker buildx build --platform linux/amd64,linux/arm64 -t registry.digitalocean.com/auto-na-juz/auto-na-juz-api:latest -f ./AutoNaJuz.Api/Dockerfile .
            docker buildx build --platform linux/amd64,linux/arm64 -t registry.digitalocean.com/auto-na-juz/auto-na-juz-web:latest -f ./AutoNaJuz.Web/Dockerfile .
            docker push registry.digitalocean.com/auto-na-juz/auto-na-juz-api:latest
            docker push registry.digitalocean.com/auto-na-juz/auto-na-juz-web:latest
        - name: Deploy to DigitalOcean
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.DIGITAL_OCEAN_SSH_HOST }}
            username: ${{ secrets.DIGITAL_OCEAN_SSH_USERNAME }}
            key: ${{ secrets.DIGITAL_OCEAN_SSH_PRIVATE_KEY }}
            script: |
              # Ensure /app directory exists
                mkdir -p /app
              
              # Copy nginx/ directory to /app/nginx
                rsync -avz ./nginx/ ${{ secrets.DIGITAL_OCEAN_SSH_USERNAME }}@${{ secrets.DIGITAL_OCEAN_SSH_HOST }}:/tmp/nginx/
                ssh -i ${{ secrets.DIGITAL_OCEAN_SSH_PRIVATE_KEY }} ${{ secrets.DIGITAL_OCEAN_SSH_USERNAME }}@${{ secrets.DIGITAL_OCEAN_SSH_HOST }} "
                sudo mv /tmp/nginx /app/nginx
                "
              
              # Extract docker-compose.dev files directly into /app
                rsync -avz ./docker-compose.dev/ ${{ secrets.DIGITAL_OCEAN_SSH_USERNAME }}@${{ secrets.DIGITAL_OCEAN_SSH_HOST }}:/tmp/docker-compose.dev/
                ssh -i ${{ secrets.DIGITAL_OCEAN_SSH_PRIVATE_KEY }} ${{ secrets.DIGITAL_OCEAN_SSH_USERNAME }}@${{ secrets.DIGITAL_OCEAN_SSH_HOST }} "
                sudo mv /tmp/docker-compose.dev/* /app/
                sudo rm -rf /tmp/docker-compose.dev
                "
              
              # Deploy the application
                cd /app &&
                docker-compose pull &&
                docker-compose -f docker-compose.yml -f docker-compose.dev.yml --profile debug down &&
                docker-compose -f docker-compose.yml -f docker-compose.dev.yml build --no-cache &&
                docker-compose -f docker-compose.yml -f docker-compose.dev.yml --profile debug up --detach