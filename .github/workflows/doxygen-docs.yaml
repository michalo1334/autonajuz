name: Generate Doxygen Documentation

on:
  push:
    branches:
      - 'dev'

jobs:
  generate-docs:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Update apt-get
      run: sudo apt-get update

    - name: Set up Doxygen
      run: sudo apt install doxygen

    - name: Set up Graphviz
      run: sudo apt-get install -y graphviz

    - name: Set up LaTeX (minimal)
      run: sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

    - name: Generate Doxygen documentation
      run: doxygen ./docsgen/Doxyfile

    - name: Generate PDF from LaTeX
      run: |
        if [ -d "docs/latex" ]; then
          cd docs/latex
          make
        else
          echo "LaTeX directory not found!"
          exit 1
        fi

    - name: Upload Doxygen documentationb 
      uses: actions/upload-artifact@v4
      with:
        name: doxygen-docs
        path: docs/html

    - name: Upload PDF documentation
      uses: actions/upload-artifact@v4
      with:
        name: doxygen-pdf
        path: docs/latex/refman.pdf
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/html
        publish_branch: docs
        keep_files: false  # Optional: removes existing files in the branch
