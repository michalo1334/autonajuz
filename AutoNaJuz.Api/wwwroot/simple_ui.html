<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Rental Service</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
    <h1>Car Rental Service</h1>
    <nav>
        <ul>
            <li><a href="#" id="nav-cars">Cars</a></li>
            <li><a href="#" id="nav-renters">Renters</a></li>
            <li><a href="#" id="nav-rentals">Rentals</a></li>
        </ul>
    </nav>
</header>
<main id="content">
    <!-- Content will be injected here -->
</main>

<!-- Templates -->
<!-- Cars Template -->
<template id="cars-template">
    <section>
        <h2>Available Cars</h2>
        <button id="add-car-button" class="btn">Add New Car</button>
        <table id="cars-table">
            <thead>
            <tr>
                <th>Title</th>
                <th>Transmission</th>
                <th>Fuel Type</th>
                <th>Production Year</th>
                <th>Seat Count</th>
                <th>Door Count</th>
                <th>Body Type</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Car rows will be injected here -->
            </tbody>
        </table>
    </section>
</template>

<!-- Renters Template -->
<template id="renters-template">
    <section>
        <h2>Renters</h2>
        <button id="add-renter-button" class="btn">Add New Renter</button>
        <table id="renters-table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Driving License ID</th>
                <th>PESEL</th>
                <th>Birth Date</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Renter rows will be injected here -->
            </tbody>
        </table>
    </section>
</template>

<!-- Rentals Template -->
<template id="rentals-template">
    <section>
        <h2>Car Rentals</h2>
        <button id="add-rental-button" class="btn">Add New Rental</button>
        <table id="rentals-table">
            <thead>
            <tr>
                <th>Car ID</th>
                <th>Renter ID</th>
                <th>From</th>
                <th>To</th>
                <th>Per Hour Cost</th>
                <th>Per Day Cost</th>
                <th>Notes</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Rental rows will be injected here -->
            </tbody>
        </table>
    </section>
</template>

<!-- Forms Template -->
<template id="form-template">
    <section>
        <h2 id="form-title"></h2>
        <form id="data-form">
            <!-- Form fields will be injected here -->
        </form>
    </section>
</template>

<!-- Rental List Template -->
<template id="rental-list-template">
    <div class="rental-list">
        <h3>Rentals</h3>
        <table class="rental-table">
            <thead>
            <tr>
                <th>Renter ID</th>
                <th>From</th>
                <th>To</th>
                <th>Notes</th>
            </tr>
            </thead>
            <tbody>
            <!-- Rental rows will be injected here -->
            </tbody>
        </table>
    </div>
</template>

<!-- Scripts -->
<script src="js/app.js"></script>
<script src="js/cars.js"></script>
<script src="js/renters.js"></script>
<script src="js/rentals.js"></script>
</body>
</html>
