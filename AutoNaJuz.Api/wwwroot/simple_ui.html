<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Rental Service</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
    <h1>Car Rental Service</h1>
    <nav>
        <ul>
            <li><a href="#" id="nav-cars">Cars</a></li>
            <li><a href="#" id="nav-renters">Renters</a></li>
            <li><a href="#" id="nav-rentals">Rentals</a></li>
            <li><a href="#" id="nav-images">Images</a></li>
        </ul>
    </nav>
</header>
<main id="content">
    <!-- Content will be injected here -->
</main>

<!-- Templates -->
<!-- Cars Template -->
<template id="cars-template">
    <section>
        <h2>Available Cars</h2>
        <button id="add-car-button" class="btn">Add New Car</button>
        <table id="cars-table">
            <thead>
            <tr>
                <th>Title</th>
                <th>Transmission</th>
                <th>Fuel Type</th>
                <th>Production Year</th>
                <th>Seat Count</th>
                <th>Door Count</th>
                <th>Body Type</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Car rows will be injected here -->
            </tbody>
        </table>
    </section>
</template>

<!-- Renters Template -->
<template id="renters-template">
    <section>
        <h2>Renters</h2>
        <button id="add-renter-button" class="btn">Add New Renter</button>
        <table id="renters-table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Driving License ID</th>
                <th>PESEL</th>
                <th>Birth Date</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Renter rows will be injected here -->
            </tbody>
        </table>
    </section>
</template>

<!-- Rentals Template -->
<template id="rentals-template">
    <section>
        <h2>Car Rentals</h2>
        <button id="add-rental-button" class="btn">Add New Rental</button>
        <table id="rentals-table">
            <thead>
            <tr>
                <th>Car ID</th>
                <th>Renter ID</th>
                <th>From</th>
                <th>To</th>
                <th>Per Hour Cost</th>
                <th>Per Day Cost</th>
                <th>Notes</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Rental rows will be injected here -->
            </tbody>
        </table>
    </section>
</template>

<!-- Forms Template -->
<template id="form-template">
    <section>
        <h2 id="form-title"></h2>
        <form id="data-form">
            <!-- Form fields will be injected here -->
        </form>
    </section>
</template>

<!-- Rental List Template -->
<template id="rental-list-template">
    <div class="rental-list">
        <h3>Rentals</h3>
        <table class="rental-table">
            <thead>
            <tr>
                <th>Renter ID</th>
                <th>From</th>
                <th>To</th>
                <th>Notes</th>
            </tr>
            </thead>
            <tbody>
            <!-- Rental rows will be injected here -->
            </tbody>
        </table>
    </div>
</template>

<!-- Images Template -->
<template id="images-template">
    <section>
        <h2>Images</h2>
        <button id="upload-image-button" class="btn">Upload New Image</button>
        <table id="images-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>MIME Type</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Image rows will be injected here -->
            </tbody>
        </table>
    </section>
</template>

<template id="upload-image-form-template">
    <section>
        <h2>Upload New Image</h2>
        <form id="upload-image-form">
            <label for="image-file">Select Image:</label>
            <input type="file" id="image-file" name="file" accept="image/*" required>
            <button type="submit" class="btn">Upload Image</button>
            <button type="button" class="btn" onclick="loadImages()">Cancel</button>
        </form>
    </section>
</template>

<template id="image-modal-template">
    <div id="image-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeImageModal()">&times;</span>
            <img id="modal-image" src="" alt="Image" />
        </div>
    </div>
</template>

<template id="carousel-modal-template">
    <div id="carousel-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeCarouselModal()">&times;</span>
            <div class="carousel-container">
                <button class="carousel-button prev-button" onclick="prevSlide()">&#10094;</button>
                <div class="carousel-slide">
                    <!-- Images will be injected here -->
                </div>
                <button class="carousel-button next-button" onclick="nextSlide()">&#10095;</button>
            </div>
            <div class="carousel-indicators">
                <!-- Indicators will be injected here -->
            </div>
        </div>
    </div>
</template>

<!-- Image Selection Modal Template -->
<template id="image-selection-modal-template">
    <div id="image-selection-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeImageSelectionModal()">&times;</span>
            <h2>Select Images to Associate</h2>
            <div id="image-list-container">
                <!-- Image list with thumbnails and checkboxes will be injected here -->
            </div>
            <button type="button" class="btn" onclick="confirmImageSelection()">Confirm Selection</button>
        </div>
    </div>
</template>


<!-- Scripts -->
<script src="js/app.js"></script>
<script src="js/cars.js"></script>
<script src="js/renters.js"></script>
<script src="js/rentals.js"></script>
<script src="js/images.js"></script>
</body>
</html>
