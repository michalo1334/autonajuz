<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoNaJuż - Wynajem Samochodów</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a href="#"><img src="img/logo.png" alt="Logo firmy AutoNaJuż"></a>
    </header>

    <main>
        <section id="reservation">
            <h2>Rezerwacja Samochodu</h2>
            <form id="reservation-form">
                <label for="start-date">Data rozpoczęcia:</label>
                <input type="date" id="start-date" required>

                <label for="end-date">Data zakończenia:</label>
                <input type="date" id="end-date" required>

                <button type="submit">Zarezerwuj</button>
            </form>
        </section>

        <section id="car-list">
            <h2>Dostępne Samochody</h2>
            <label class="filter-label">Filtruj według kategorii:</label>
            <select class="filter" id="filter">
                <option value="all">Wszystkie</option>
            </select>
            <div id="cars">
                <!-- Lista samochodów generowana dynamicznie -->
            </div>
        </section>
    </main>

    <footer>
        <p class="footer">&copy; 2024 AutoNaJuż. Wszystkie prawa zastrzeżone.</p>
    </footer>

    <!-- Modal -->
    <div id="car-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-left">
                <img id="modal-car-image" src="" alt="Zdjęcie samochodu">
            </div>
            <div class="modal-right">
                <h3 id="modal-car-title">Tytuł</h3>
                <p id="modal-car-transmission">Skrzynia: </p>
                <p id="modal-car-seats">Miejsca: </p>
                <p id="modal-car-doors">Drzwi: </p>
                <p id="modal-car-fuel">Paliwo: </p>
                <p id="modal-car-year">Rok produkcji: </p>
                <button id="reserve-button">Zarezerwuj</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
