<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz wysyłania e-maila</title>
</head>
<body>
    <h1>Potwierdzenie rezerwacji</h1>
    <form id="emailForm">
        <label for="to">Do:</label>
        <input type="email" id="to" name="to" required><br><br>

        <label for="subject">Imię:</label>
        <input type="text" id="Imie" name="Imie" required><br><br>

        <label for="subject">Nazwisko:</label>
        <input type="text" id="Nazwisko" name="Nazwisko" required><br><br>

        <label>
            <input type="checkbox" id="ageConfirmation" name="ageConfirmation" required>
            Potwierdzam, że mam ukończone 18 lat.
        </label><br><br>

        <label>
            <input type="checkbox" id="rodoConfirmation" name="rodoConfirmation" required>
            Wyrażam zgodę na przetwarzanie moich danych osobowych zgodnie z 
            <a href="/polityka-prywatnosci" target="_blank">polityką prywatności</a>.
        </label><br><br>

        <button type="submit">Portwierdź rezerwację</button>
    </form>

    <script>
        document.getElementById('emailForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const formData = new FormData(this);
            const firstName = formData.get('Imie');
            const lastName = formData.get('Nazwisko');
            const toEmail = formData.get('to');
            
            // Tworzenie wiadomości
            const message = `
                <p>Szanowny/a ${firstName} ${lastName},</p>
                <p>Dziękujemy za dokonanie rezerwacji. Wkrótce skontaktujemy się z Tobą, aby potwierdzić szczegóły.</p>
                <p>Pozdrawiamy,<br>Zespół AutoNaJuż</p>
            `;

            const data = {
                To: toEmail,
                Subject: "Potwierdzenie rezerwacji",
                Message: message
            };

            try {
                const response = await fetch(`${API_URL}/Emails/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('E-mail został wysłany pomyślnie!');
                } else {
                    alert('Wystąpił błąd przy wysyłaniu e-maila.');
                }
            } catch (error) {
                console.error('Błąd:', error);
                alert('Wystąpił błąd przy wysyłaniu e-maila.');
            }
        });
    </script>
    <script src="apiUrls.js"></script>
</body>
</html>
