server {
    listen 80;
    server_name api.dev.michalo.works;

    location /.well-known/acme-challenge/ {
       allow all;
       root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

#uncomment once certificate is obtained and installed by certbot then restart nginx
server {
    listen 443 ssl;
    server_name api.dev.michalo.works;

    ssl_certificate /etc/letsencrypt/live/dev.michalo.works/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.michalo.works/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://autonajuzapi:3123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection keep-alive;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
